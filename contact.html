<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Contact Us - Five Labs</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" href="./images/favicon.ico" type="image/x-icon" />
		<style>
			/* Reset and base styles */
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family: "Inter", sans-serif;
				background-color: black;
				color: white;
				line-height: 1.6;
			}
			nav {
				position: fixed;
				top: 0;
				width: 100%;
				z-index: 1000;
				padding: 20px 0;
				background: rgba(0, 0, 0, 0.8);
			}
			.logo img {
				height: 50px; /* Adjust the height as per your design */
				width: auto; /* Maintains aspect ratio */
				display: block;
			}
			.container {
				width: 90%;
				max-width: 1200px;
				margin: 0 auto;
			}
			nav .container {
				display: flex;
				justify-content: space-between;
				align-items: center;
			}
			nav a {
				color: white;
				text-decoration: none;
				font-size: 14px;
				letter-spacing: 2px;
				margin-left: 30px;
				position: relative;
				transition: color 0.3s ease;
			}
			nav a::after {
				content: "";
				position: absolute;
				width: 100%;
				height: 2px;
				bottom: -5px;
				left: 0;
				background-color: white;
				transform: scaleX(0);
				transition: transform 0.3s ease;
			}
			nav a:hover {
				color: #cccccc;
			}
			nav a:hover::after {
				transform: scaleX(1);
			}
			.contact-section {
				display: flex;
				height: 100vh;
			}
			.left {
				flex: 1;
				background-image: url("./images/contact.jpg");
				background-size: cover;
				background-position: center;
			}
			.right {
				flex: 1;
				padding: 80px 40px;
				display: flex;
				flex-direction: column;
				justify-content: center;
			}
			.right h1 {
				font-family: "Playfair Display", serif;
				font-size: 3rem;
				margin-bottom: 20px;
			}
			.right p {
				font-size: 1rem;
				color: rgba(255, 255, 255, 0.8);
				margin-bottom: 20px;
			}
			.social-links a {
				display: inline-block;
				font-size: 1rem;
				color: white;
				text-decoration: none;
				margin-bottom: 10px;
				margin-right: 20px;
				padding: 10px 20px;
				transition: all 0.5s ease;
			}
			.social-links a:hover {
				background-color: white;
				color: black;
				transform: translateY(-3px);
				box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
			}

			/* Responsive styles */
			@media (max-width: 768px) {
				.contact-section {
					flex-direction: column;
				}
				.left,
				.right {
					flex: none;
					height: 50vh;
				}
				.right {
					padding: 40px 20px;
				}
				.right h1 {
					font-size: 2rem;
				}
			}
		</style>
	</head>
	<body>
		<nav>
			<div class="container">
				<a href="./index.html" class="logo">
					<img src="./images/black.png" alt="Five Labs Logo" />
				</a>
				<div class="links">
					<a href="./work.html">Work</a>
					<a href="./manifesto.html">Manifesto</a>
					<a href="./contact.html">Contact</a>
				</div>
			</div>
		</nav>

		<section class="contact-section">
			<div class="left"></div>
			<div class="right">
				<h1>Fellow creators, we seek</h1>
				<p>Find us here</p>
				<div class="social-links">
					<a href="https://twitter.com/five" target="_blank"
						>Twitter</a
					>
					<a
						href="https://linkedin.com/in/fivelabs-hq"
						target="_blank"
						>LinkedIn</a
					>
					<a href="mailto:mehul@fivelabs.co">Email Us</a>
				</div>
			</div>
		</section>
	</body>
</html>
