<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Five Labs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="icon" href="./images/favicon.ico" type="image/x-icon" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", sans-serif;
            background-color: rgba(0, 0, 0, 0.939);
            color: white;
            line-height: 1.6;
        }
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 20px 0;
            transition: background 0.3s ease;
        }
        .logo img {
            height: 50px;
            width: auto;
            float: right;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .hero {
            height: 100vh;
            background-image: url("./try.jpg");
            background-size: cover;
            background-position: top center;
            display: flex;
            align-items: center;
            position: relative;
        }
        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
        }
        .hero-content {
            position: relative;
            z-index: 1;
        }
        h1 {
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.837);
            font-family: "Playfair Display", serif;
            font-size: 3rem;
            line-height: 1.2;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }
        h1 span {
            text-shadow: none;
            font-style: italic;
            font-weight: 300;
            font-size: 1.8rem;
            display: block;
            margin-top: 15px;
        }
        
        .products-section {
            margin-bottom: 60px;
            margin-top: 40px;
        }
        
        .products-section h3 {
            font-family: "Playfair Display", serif;
            font-size: 1.2rem;
            margin: 35px 0 20px 0;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 2px;
            font-weight: 400;
        }
        .hero p {
            max-width: 600px;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: transparent;
            border: 1px solid white;
            color: white;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: white;
            color: black;
        }
        .contact {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding: 25px 0;
            transform: translateY(100%);
            transition: transform 0.4s ease-in-out;
            z-index: 900;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .social-links a {
				display: inline-block;
				font-size: 1rem;
				color: white;
				text-decoration: none;
				margin-bottom: 10px;
				margin-right: 20px;
				padding: 10px 20px;
				transition: all 0.5s ease;
			}
			.social-links a:hover {
				background-color: white;
				color: black;
				transform: translateY(-3px);
				box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
			}
        
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .button-group .btn {
            margin-bottom: 10px;
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="./index.html" class="logo">
                <img src="./black.png" alt="Five Labs Logo" />
            </a>
        </div>
    </nav>

    <section class="hero">
        <div class="container hero-content">
            <h1><br/> <br/><br/> Five Labs
                <span>building a better future</span>
            </h1>
            <div class="products-section">
                <h3>Products</h3>
                <div class="button-group">
                    <a href="https://writerbot.cc" class="btn">Writerbot</a>
                    <a href="https://interiorbot.xyz" class="btn">Interiorbot</a>
                    <a href="#" class="btn">Pathfinder</a>
                </div>
                
                <h3>Research</h3>
                <div class="button-group">
                    <a href="https://substack.com/@fivelabs" class="btn">Read more about our work here</a>
                </div>
                
                <h3>Find us here</h3>
                <div class="button-group">
                    <a href="https://www.linkedin.com/company/fivelabs-hq" class="btn"><i>LinkedIn</i></a>
                    <a href="https://x.com/five" class="btn"><i>Twitter</i></a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
