<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Page Not Found - Five Labs</title>
		<meta name="description" content="The page you're looking for doesn't exist. Return to Five Labs homepage to explore our AI research and products." />
		<meta name="robots" content="noindex, nofollow" />
		
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" href="images/favicon.ico" type="image/x-icon" />
		<link rel="stylesheet" href="./css/style.css" />
		<link rel="stylesheet" href="./css/mobile.css" />
		
		<style>
			.error-section {
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 80px 0;
				background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
			}
			
			.error-content {
				max-width: 600px;
				padding: 0 20px;
			}
			
			.error-code {
				font-family: 'Playfair Display', serif;
				font-size: 8rem;
				font-weight: 700;
				color: rgba(255, 255, 255, 0.1);
				margin-bottom: 20px;
				line-height: 1;
			}
			
			.error-title {
				font-family: 'Playfair Display', serif;
				font-size: 2.5rem;
				color: #ffffff;
				margin-bottom: 20px;
				font-weight: 600;
			}
			
			.error-description {
				font-family: 'Inter', sans-serif;
				font-size: 1.1rem;
				color: rgba(255, 255, 255, 0.8);
				margin-bottom: 40px;
				line-height: 1.6;
			}
			
			.error-actions {
				display: flex;
				gap: 20px;
				justify-content: center;
				flex-wrap: wrap;
			}
			
			@media (max-width: 768px) {
				.error-code {
					font-size: 6rem;
				}
				
				.error-title {
					font-size: 2rem;
				}
				
				.error-description {
					font-size: 1rem;
				}
				
				.error-actions {
					flex-direction: column;
					align-items: center;
				}
			}
		</style>
	</head>
	<body>
		<nav>
			<div class="container">
				<a href="./index.html" class="logo">
					<img src="images/black.webp" alt="Five Labs Logo" />
				</a>
				<div class="links">
					<a href="./work.html">Work</a>
					<a href="./whitepaper.html">Whitepaper</a>
					<a href="./contact.html">Contact</a>
				</div>
				<button class="hamburger" onclick="toggleMobileMenu()" aria-label="Toggle mobile menu" aria-expanded="false" aria-controls="mobileMenu">
					<span></span>
					<span></span>
					<span></span>
				</button>
			</div>
			<nav class="mobile-menu" id="mobileMenu" role="navigation" aria-label="Mobile navigation">
				<a href="./work.html">Work</a>
				<a href="./whitepaper.html">Whitepaper</a>
				<a href="./contact.html">Contact</a>
			</nav>
		</nav>

		<section class="error-section">
			<div class="error-content">
				<div class="error-code">404</div>
				<h1 class="error-title">Page Not Found</h1>
				<p class="error-description">
					The page you're looking for seems to have wandered off into the digital void. 
					Don't worry, even our AI agents sometimes take wrong turns.
				</p>
				<div class="error-actions">
					<a href="./index.html" class="btn">← Back to Home</a>
					<a href="./work.html" class="btn">Explore Our Work</a>
				</div>
			</div>
		</section>

		<script src="./js/scripts.js"></script>
		<script>
			// Change nav background on scroll
			window.addEventListener("scroll", () => {
				const nav = document.querySelector("nav");
				if (window.scrollY > 10) {
					nav.style.background = "rgba(0, 0, 0, 0.8)";
				} else {
					nav.style.background = "transparent";
				}
			});
		</script>
	</body>
</html>
